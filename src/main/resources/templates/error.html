<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container text-center py-5">
    <h1 class="display-6" th:text="${status ?: 'Error'}">404</h1>
    <p class="lead" th:text="${message ?: (error ?: 'Something went wrong.')}">
        Something went wrong.
    </p>
    <a class="btn btn-primary" th:href="@{/ui/messages/new}">Back to the message form</a>
</main>
</body>
</html>
