<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | Smart Lead'}">Smart Lead</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/ui/messages/new}">Smart Lead</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/ui/messages/new}">New message</a>
            <a class="nav-link" th:href="@{/ui/messages}">Messages</a>
            <a class="nav-link" th:href="@{/ui/leads}">Leads</a>
        </div>
    </div>
</nav>

<!-- Clickable column header. Clicking the active column flips its direction; other columns start ascending.
     Links drop the page number, so a sort change returns to the first page. -->
<th th:fragment="sortHeader(label, property, basePath, sortProperty, sortDirection, size)"
    scope="col"
    th:attr="aria-sort=${property == sortProperty} ? (${sortDirection == 'asc'} ? 'ascending' : 'descending') : 'none'">
    <a class="text-decoration-none text-reset text-nowrap"
       th:href="@{${basePath}(sort=${property + ',' + ((property == sortProperty and sortDirection == 'asc') ? 'desc' : 'asc')}, size=${size})}">
        <span th:text="${label}">Label</span>
        <span th:if="${property == sortProperty}" th:text="${sortDirection == 'asc'} ? '▲' : '▼'">▲</span>
    </a>
</th>

<!-- Page links for a Spring Data Page. Each link keeps the current sort and page size.
     basePath is the list URL, e.g. /ui/leads. -->
<div th:fragment="pagination(page, basePath, sortProperty, sortDirection)">
    <nav th:if="${page.totalPages > 1}" aria-label="Pages">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{${basePath}(page=${page.number - 1}, size=${page.size}, sort=${sortProperty + ',' + sortDirection})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{${basePath}(page=${i}, size=${page.size}, sort=${sortProperty + ',' + sortDirection})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{${basePath}(page=${page.number + 1}, size=${page.size}, sort=${sortProperty + ',' + sortDirection})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
