spring.config.import=optional:file:.env[.properties]

server.port=8080
server.servlet.context-path=/v1/api

spring.application.name=smartlead

# HTTP client timeouts
ai.http.connect-timeout=3s
ai.http.read-timeout=60s

# hugging face configuration
huggingface.api-key=${HF_TOKEN:}
huggingface.url=https://router.huggingface.co/v1/chat/completions
huggingface.model=meta-llama/Llama-3.3-70B-Instruct
#huggingface.max-tokens=256
huggingface.temperature=0.1

# local fallback ai
ollama.url=http://localhost:11434/api/generate
ollama.model=llama3.2:latest

# H2 configuration
spring.datasource.url=jdbc:h2:mem:smartlead;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pagination for GET /messages and GET /leads
spring.data.web.pageable.max-page-size=25
